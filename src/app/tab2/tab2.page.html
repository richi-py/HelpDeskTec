<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <ion-icon name="arrow-back-outline" style="padding-right: 20px;" (click)="backPage()"></ion-icon>
      Incidencias
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-searchbar
    [(ngModel)]="textoBusqueda"
    placeholder="Buscar por el numero o descripcion...">
  </ion-searchbar>

  <ion-segment [(ngModel)]="filtroEstado" scrollable="true" style="padding-top: 20px;">
    <ion-segment-button value="todas">
      <ion-label>Todas</ion-label>
    </ion-segment-button>
    <ion-segment-button value="pendiente">
      <ion-label>Pendientes</ion-label>
    </ion-segment-button>
    <ion-segment-button value="en_proceso">
      <ion-label>En proceso</ion-label>
    </ion-segment-button>
    <ion-segment-button value="resuelta">
      <ion-label>Resueltas</ion-label>
    </ion-segment-button>
  </ion-segment>

  <ion-list class="listIn">
    @for (item of incidenciasFiltradas; track item.codigo) {
      <ion-item>
        <ion-label>
          <h3>#{{ item.codigo }} - {{ item.titulo }}</h3>
          <p>{{ item.created_at | tiempoRelativo }}</p>
        </ion-label>
        <ion-badge slot="end" [color]="item.badgeColor">{{ item.estadoTexto }}</ion-badge>
      </ion-item>
    } @empty {
      <ion-item lines="none">
        <ion-label class="ion-text-center">
          <p>No se encontraron incidencias</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
