<ion-content>
    <ion-img src="assets/icon/image.png" id="mimg" style="padding-top: 40px;"></ion-img>

    <p class="subLogin"><strong>Inicia sesion para continuar</strong></p>
    <div class="form">
        <ion-list>
            <ion-item style="padding-bottom: 20px;">
                <ion-input type="email" [(ngModel)]="correo" name="correo" labelPlacement="floating" placeholder="JuanHT@empresa.com" fill="outline">
                    <ion-icon name="person-outline" slot="start"></ion-icon>
                    <div slot="label">Email</div>
                </ion-input>
            </ion-item>
            <ion-item>
                <ion-input type="password" [(ngModel)]="password" name="password" password-toggle="true" fill="outline" label-placement="floating">
                    <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
                    <div slot="label">Contraseña</div>
                    <ion-input-password-toggle slot="end" color="success"></ion-input-password-toggle>
                </ion-input>
            </ion-item>
        </ion-list>
        @if (errorMensaje) {
          <p class="ion-text-center" style="color: var(--ion-color-danger); margin-top: 14px; font-size: 0.9rem; font-weight: 500;">
            {{ errorMensaje }}
          </p>
        }
        <ion-button 
          id="btnLog"
          style="padding-top: 20px; color: #FFFFFF;" 
          (click)="pageHelpTec()" 
          [disabled]="cargando"
          expand="block" 
          color="success">
          @if (cargando) {
            <ion-spinner name="crescent" color="light"></ion-spinner>
          } @else {
            Ingresar
          }
        </ion-button>

        <div class="crear-cuenta-wrapper">
          <p class="crear-cuenta-pregunta">¿No tienes una cuenta aún?</p>
          <a class="crear-cuenta-link" (click)="irARegistro()">
            <ion-icon name="person-add-outline"></ion-icon>
            <span>CREAR CUENTA EN HELPDESK</span>
          </a>
        </div>
    </div>
</ion-content>
